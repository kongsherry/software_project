<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 单细胞 ANN 检索系统</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='auth.css') }}">
</head>
<body>
<div class="auth-container">
    <div class="auth-card">
        <div class="auth-header">
            <h1>单细胞 ANN 检索系统</h1>
            <p>用户登录</p>
        </div>

        <div id="authError" class="auth-error" style="display:none;"></div>

        <form id="loginForm" onsubmit="return handleLogin(event)">
            <div class="form-group">
                <label for="username">用户名</label>
                <input id="username" type="text" placeholder="请输入用户名" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">密码</label>
                <input id="password" type="password" placeholder="请输入密码" required>
            </div>
            <button type="submit" class="auth-btn">登 录</button>
        </form>

        <div class="auth-footer">
            还没有账号？<a href="{{ url_for('register_page') }}">立即注册</a>
        </div>
    </div>
</div>

<script>
async function handleLogin(event) {
    event.preventDefault();
    const errorEl = document.getElementById("authError");
    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;
    const btn = event.target.querySelector("button");

    errorEl.style.display = "none";
    btn.disabled = true;
    btn.textContent = "登录中...";

    try {
        const response = await fetch("/api/auth/login", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({ username, password }),
        });
        const data = await response.json();
        if (!response.ok) {
            errorEl.textContent = data.error || "登录失败";
            errorEl.style.display = "block";
            btn.disabled = false;
            btn.textContent = "登 录";
            return;
        }
        window.location.href = "/";
    } catch (err) {
        errorEl.textContent = "网络错误：" + err.message;
        errorEl.style.display = "block";
        btn.disabled = false;
        btn.textContent = "登 录";
    }
}
</script>
</body>
</html>
